<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTA Ambiental</title>
    <script>
      // O GitHub Pages não conhece as rotas do React Router.
      // Guarda a rota e devolve o usuário ao index.html para a aplicação restaurá-la.
      const redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, '', redirect)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      sessionStorage.redirect = location.href
      location.replace('/rta-ambiental-github-pages/')
    </script>
  </body>
</html>
